<!DOCTYPE html>
<html>
<head>

<link rel="icon" type="image/png" href="logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Click & Clasp Order Form</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap');

h1{
  text-align:center;
  font-family:'Cormorant Garamond', serif;
  font-size:42px;
  letter-spacing:4px;
  margin-bottom:0;
  font-weight:600;
  color:#ffffff;
}

h2{
  font-family:'Inter', sans-serif;
  letter-spacing:5px;
  font-size:13px;
  font-weight:400;
  margin-top:4px;
  margin-bottom:25px;
  opacity:0.8;
  text-align:center;
}

body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:
  radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 30%),
  linear-gradient(180deg,#0b2d3a,#102d40,#0a2230);
  color:white;
  display:flex;
  justify-content:center;
  min-height:100vh;
  padding:25px 14px;
}

.container{
  width:100%;
  max-width:440px;
  margin-top:10px;
  text-align:center;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:28px;
  padding:28px 22px;
  box-shadow:
  0 10px 40px rgba(0,0,0,0.28),
  inset 0 1px 0 rgba(255,255,255,0.06);
}

#date,
#order{
  font-size:12px;
  letter-spacing:1px;
  opacity:0.75;
  margin-bottom:4px;
  text-align:left;
}

input,
select,
textarea{
  width:100%;
  padding:14px 14px;
  margin:8px 0;
  border:none;
  border-radius:14px;
  box-sizing:border-box;
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:14px;
  font-family:'Inter', sans-serif;
  transition:0.25s;
  border:1px solid rgba(255,255,255,0.12);
}

input::placeholder,
textarea::placeholder{
  color:rgba(255,255,255,0.55);
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border:1px solid rgba(255,255,255,0.22);
  background:rgba(255,255,255,0.11);
  transform:translateY(-1px);
}

select{
  appearance:none;
  cursor:pointer;
  color:#f3f3f3;
}

select option{
  background:#18384a;
  color:#ffffff;
}

textarea{
  resize:none;
  height:90px;
}

.card{
  position:relative;
  width:100%;
  max-width:400px;
  margin:18px auto;
  border-radius:24px;
  padding:20px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  box-shadow:0 8px 25px rgba(0,0,0,0.15);
}

.card h3{
  font-family:'Cormorant Garamond', serif;
  font-size:26px;
  font-weight:600;
  text-align:left;
  margin-top:0;
  margin-bottom:12px;
  letter-spacing:1px;
}

/* KEYCHAINS ROW */
.design-row{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-top:10px;
  scroll-behavior:smooth;
}

.design-row::-webkit-scrollbar{
  height:6px;
}

.design-row::-webkit-scrollbar-track{
  background:transparent;
}

.design-row::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,0.22);
  border-radius:20px;
}

.design-row{
  align-items:flex-start;
}

.designs{
  display:flex;
  gap:14px;
  flex-wrap:nowrap;
}

.designs img{
  width:78px;
  height:auto;

  max-height:140px;

  object-fit:contain;
  object-position:center;

  flex-shrink:0;

  border-radius:14px;
  cursor:pointer;

  opacity:0.45;
  transition:0.28s ease;

  border:2px solid transparent;

  background:#18394a;

  padding:2px;
}

.designs img:hover{
  opacity:0.85;
  transform:translateY(-2px);
}

 .remove-btn{
position:absolute;
top:12px;
right:12px;

width:30px !important;
height:30px !important;

min-width:30px;
max-width:30px;

padding:0 !important;
margin:0 !important;

border:none;
border-radius:50%;

background:rgba(255,255,255,0.12);
color:white;

font-size:18px;
line-height:1;

cursor:pointer;

display:flex;
align-items:center;
justify-content:center;

transition:0.2s;

z-index:999;

box-shadow:none;
}

.remove-btn:hover{
background:rgba(255,255,255,0.22);
transform:scale(1.08);
}

.designs img.selected{
  opacity:1;
  transform:scale(1.06);
  border:2px solid rgba(255,255,255,0.9);
  box-shadow:0 8px 18px rgba(0,0,0,0.28);
}

/* UPLOAD */
.upload-box{
  border:1.5px dashed rgba(255,255,255,0.28);
  padding:18px;
  margin-top:14px;
  border-radius:18px;
  cursor:pointer;
  font-size:14px;
  transition:0.25s;
  background:rgba(255,255,255,0.03);
}

.upload-box:hover{
  background:rgba(255,255,255,0.06);
  border-color:rgba(255,255,255,0.45);
}

/* PREVIEW */
.preview{
  display:flex;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}

.preview img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.15);
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#ffffff,#e9edf2);
  color:#0f3b4f;
  font-family:'Inter', sans-serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:0.5px;
  cursor:pointer;
  transition:0.25s ease;
  box-shadow:0 8px 20px rgba(0,0,0,0.18);
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 24px rgba(0,0,0,0.22);
}

button:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

#total{
  margin-top:25px;
  font-family:'Cormorant Garamond', serif;
  font-size:34px;
  font-weight:600;
  letter-spacing:1px;
}

@media (max-width:480px){

  .container{
    padding:24px 16px;
    border-radius:24px;
  }

  h1{
    font-size:34px;
  }

  .designs img{
    width:70px;
    height:112px;
  }

}

</style>
</head>

<body>

<div class="container">

<h1>CLICK & CLASP</h1>

<h2>ORDER FORM</h2>

<div id="date"></div>
<div id="order"></div>

<input id="name" placeholder="Name">
<input id="email" placeholder="Email/Instagram">
<input id="school" placeholder="School">
<input id="grade" placeholder="Grade">
<input id="section" placeholder="Section">

<div id="items"></div>

<button onclick="addItem()">+ Add Keychain</button>

<h3 id="total">Total: ₱0</h3>

<button id="submitBtn" onclick="submitOrder()">Submit Order</button>

</div>

<script>

emailjs.init("tp0-EdHc-e3iYbotR");

let orderNum = Math.floor(Math.random()*90000)+10000;

document.getElementById("order").innerText =
"Order #: " + orderNum;

document.getElementById("date").innerText =
"Date: " + new Date().toLocaleDateString();

let itemCount = 0;

function addItem(){

  itemCount++;

  let div = document.createElement("div");

  div.className = "card";

div.innerHTML = `

  ${itemCount > 1 ? `
    <button class="remove-btn" onclick="removeItem(this)">×</button>
  ` : ""}

  <h3>Item ${itemCount}</h3>

    <select onchange="toggleSections(this)">
      <option value="design">Pre-made (₱30)</option>
      <option value="custom">Custom (₱40)</option>
    </select>

    <div class="designSection" style="display:block">

      <div class="design-row">

        <div class="designs">

          ${[1,2,3,4,5,6,7,8].map(n=>`

            <img
              src="design${n}.png"
              data-name="design${n}"
              onclick="selectDesign(this)"
            >

          `).join("")}

        </div>

      </div>

    </div>

    <div class="customSection" style="display:none;">

      <textarea placeholder="Custom Request..."></textarea>

      <div class="upload-box" onclick="openFile(this)">
        Upload Inspo Photos (optional)

        <input
          type="file"
          multiple
          hidden
          onchange="handleFiles(this, false)"
        >
      </div>

      <div class="preview"></div>

    </div>

    <div class="upload-box" onclick="openFile(this)">
      Upload Photos (4 for photo strip)

      <input
        type="file"
        multiple
        hidden
        onchange="handleFiles(this, true)"
      >
    </div>

    <div class="preview"></div>

  `;

  document.getElementById("items").appendChild(div);

  updateTotal();
}

function openFile(box){
  box.querySelector("input").click();
}

function removeItem(btn){

const card = btn.closest(".card");

if(card){
card.remove();
}

updateTotal();
}


function toggleSections(sel){

  let card = sel.closest(".card");

  card.querySelector(".designSection").style.display = "none";
  card.querySelector(".customSection").style.display = "none";

  if(sel.value==="design"){
    card.querySelector(".designSection").style.display="block";
  }

  if(sel.value==="custom"){
    card.querySelector(".customSection").style.display="block";
  }

  updateTotal();
}

function selectDesign(img){

  let card = img.closest(".card");

  card.querySelectorAll(".designs img")
  .forEach(i=>i.classList.remove("selected"));

  img.classList.add("selected");
}

/* HANDLE FILES */

function handleFiles(input, isMain){

  let previewBox =
  input.parentElement.nextElementSibling;

  let files = [...input.files];

  if(isMain) files = files.slice(0,4);

  previewBox.innerHTML = "";

  files.forEach(file=>{

    let wrapper = document.createElement("div");

    wrapper.file = file;

    let img = document.createElement("img");

    img.src = URL.createObjectURL(file);

    wrapper.appendChild(img);

    previewBox.appendChild(wrapper);

  });
}

/* TOTAL */

function updateTotal(){

  let total = 0;

  document.querySelectorAll(".card").forEach(card=>{

    let val = card.querySelector("select").value;

    if(val==="design") total+=30;

    if(val==="custom") total+=40;

  });

  document.getElementById("total").innerText =
  "Total: ₱"+total;
}

/* CLOUDINARY */

async function uploadToCloudinary(file){

  let formData = new FormData();

  formData.append("file", file);

  formData.append("upload_preset", "keychain_upload");

  let res = await fetch(
    "https://api.cloudinary.com/v1_1/dacsw26s3/image/upload",
    {
      method:"POST",
      body:formData
    }
  );

  let data = await res.json();

  return data.secure_url;
}

/* SUBMIT */

async function submitOrder(){

  let btn = document.getElementById("submitBtn");

  btn.disabled = true;

  btn.innerText = "Uploading...";

  let items = [];

  let photoGroups = "";

  let inspoGroups = "";

  let designNames = {

    "design1":"Film Strip",
    "design2":"Gwen Stacey",
    "design3":"Miles Morales",
    "design4":"Blue Ocean",
    "design5":"Red Stripes",
    "design6":"Pink Pattern",
    "design7":"Yellow Sun",
    "design8":"Lavender Bloom"

  };

  let cards = document.querySelectorAll(".card");

  for(let i=0;i<cards.length;i++){

    let card = cards[i];

    let type = card.querySelector("select").value;

    let design = "None";

    if(type==="design"){

      let selected = card.querySelector(".selected");

      if(selected){
        design = designNames[selected.dataset.name];
      }
    }

    if(type==="custom"){

      design =
      card.querySelector("textarea").value
      || "Custom Request";
    }

    items.push(
      `Item ${i+1}: ${type.toUpperCase()} - ${design}`
    );

    /* MAIN PHOTOS */

    let previews = card.querySelectorAll(".preview");

    let main = previews[previews.length-1];

    if(main.children.length){

      photoGroups += `\nItem ${i+1} Photos:\n`;

      for(let p of main.children){

        let url = await uploadToCloudinary(p.file);

        photoGroups += url + "\n";
      }
    }

    /* INSPO */

    let inspo =
    card.querySelector(".customSection .preview");

    if(inspo && inspo.children.length){

      inspoGroups += `\nItem ${i+1} Inspo Photos:\n`;

      for(let p of inspo.children){

        let url = await uploadToCloudinary(p.file);

        inspoGroups += url + "\n";
      }
    }
  }

  let totalText =
  document.getElementById("total").innerText;

  emailjs.send(
    "service_wuyfomj",
    "template_wlwgyco",
    {

      order_number: orderNum,

      name:
      document.getElementById("name").value,

      email:
      document.getElementById("email").value,

      school:
      document.getElementById("school").value,

      grade:
      document.getElementById("grade").value,

      section:
      document.getElementById("section").value,

      items: items.join("\n"),

      photos: photoGroups,

      inspo: inspoGroups,

      total: totalText

    }
  )

  .then(()=>{

    window.location.href="thankyou.html";

  })

  .catch(()=>{

    alert("Failed to send");

    btn.disabled = false;

    btn.innerText = "Submit Order";

  });
}

addItem();

</script>

</body>
</html>
